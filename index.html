<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Marks the document JS-capable before first paint, so the entrance
         animations can start hidden without hiding anything from crawlers or
         JS-off visitors. The timer is a failsafe: if the bundle never loads,
         every reveal is un-hidden rather than leaving the page blank. -->
    <script>
      (function () {
        var el = document.documentElement;
        el.classList.add('js');
        setTimeout(function () {
          if (!window.__appMounted) el.classList.remove('js');
        }, 3000);
      })();
    </script>

    <title>Akhrorov — Websites, Mobile Apps & AI Automation</title>
